name: Check
on: [push, pull_request]
jobs:
  web-and-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --locked -p cloudlab --all-targets -- -D warnings
      - run: cargo test --locked -p cloudlab
      - run: cargo build --locked -p cloudlab
      - run: ./scripts/build-images.sh terminal
      - run: python3 tests/integration.py
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npm run build
      - run: cargo check --locked -p cloudlab-desktop
